[app]
name = "navidrome"
version = "0.1.0"
description = "Navidrome music server and streamer"

[runtime.container]
image = "Dockerfile"
port = 3000

[routing]
public_paths = ["/"]

[resources]
memory_mb = 256
# Measured clean --no-cache build peak ~393 MiB (0.38 GiB), from
# pulling/extracting the deluan/navidrome base image. Runtime memory_mb
# (256) is lower, so without an explicit build cap the build can OOM.
# Sized to the measured peak rounded up to the next 0.5 GiB.
build_memory_mb = 512
cpu_cores = 0.25

[data]
app_data = true
